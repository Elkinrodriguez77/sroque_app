name: CI / Deploy

# Valida en cada push y en cada Pull Request hacia main.
# El deploy en Render SOLO se dispara si la validación pasa y es un push a main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si se empujan varios commits seguidos, cancela los runs viejos en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar (instalar, sintaxis, arranque)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci instala EXACTAMENTE lo del package-lock.json y falla si el lock
      # está desincronizado con package.json. Es la instalación reproducible.
      - name: Instalar dependencias (npm ci)
        run: npm ci

      # Chequeo de sintaxis de todos los .js de src/ y scripts/ sin ejecutarlos.
      - name: Validar sintaxis
        run: |
          set -e
          for f in $(find src scripts -name '*.js'); do
            node --check "$f"
          done
          echo "Sintaxis OK"

      # Arranca el servidor de verdad y comprueba que responde (sin tocar la BD).
      - name: Smoke test de arranque
        run: npm test

      # Informativo: lista vulnerabilidades pero NO bloquea el deploy, para que
      # un advisory nuevo no impida un despliegue urgente. Revísalo de todas formas.
      - name: Auditoría de seguridad (informativa)
        run: npm audit --audit-level=high
        continue-on-error: true

  deploy:
    name: Desplegar en Render
    needs: validate
    runs-on: ubuntu-latest
    # Solo en push directo a main (no en Pull Requests).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Disparar deploy hook de Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Quitar posibles espacios/saltos de línea al copiar el secret.
          HOOK="$(printf '%s' "$RENDER_DEPLOY_HOOK_URL" | tr -d '[:space:]')"
          if [ -z "$HOOK" ]; then
            echo "::error::Falta el secret RENDER_DEPLOY_HOOK_URL (vacío o no configurado)."
            echo "Revísalo en GitHub → Settings → Secrets and variables → Actions → pestaña 'Secrets' (no 'Variables')."
            exit 1
          fi
          echo "Secret presente (longitud: ${#HOOK}). Disparando deploy en Render..."
          # -L sigue redirecciones; capturamos código y cuerpo para diagnóstico.
          http_code=$(curl -sS -L -X POST -o /tmp/render_resp.txt -w "%{http_code}" "$HOOK" || echo "000")
          echo "Render respondió HTTP $http_code"
          echo "Respuesta: $(cat /tmp/render_resp.txt 2>/dev/null | head -c 300)"
          # Aceptamos cualquier 2xx como deploy aceptado.
          case "$http_code" in
            2*) echo "✅ Deploy disparado correctamente." ;;
            401|403) echo "::error::El hook respondió $http_code (no autorizado). La URL del secret parece incorrecta o incompleta."; exit 1 ;;
            404) echo "::error::El hook respondió 404. El identificador del servicio en la URL no existe (¿URL mal copiada?)."; exit 1 ;;
            000) echo "::error::No se pudo conectar con Render (URL inválida o sin red)."; exit 1 ;;
            *)   echo "::error::El deploy hook no respondió OK (HTTP $http_code)."; exit 1 ;;
          esac
